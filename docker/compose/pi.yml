# The Pi's ROS container: Orbbec Gemini 335 under orbbec/. Built and run on the Pi itself
# (`make pi-up`, robot/pi/README.md). Paths resolve from the repo root and .env there is read,
# as for ros.yml.
name: deictic

services:
  pi:
    image: deictic/pi:humble
    build:
      context: .
      dockerfile: docker/pi/Dockerfile
    network_mode: host  # DDS to the bringup machine
    privileged: true    # the Orbbec driver opens the USB device directly
    volumes:
      - /dev:/dev       # mounted, not passed as a device: the camera re-enumerates when the driver starts it
      - ./configs:/deictic/configs:ro
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///deictic/configs/cyclonedds.xml
      DDS_IFACE: ${DDS_IFACE:-}  # wlan0 on Wi-Fi; required, checked by the entrypoint
      PI_IP: ${PI_IP:-}
      BRIDGE_IP: ${BRIDGE_IP:-}  # the machine running bringup: the Pi's DDS peer
    command: ros2 launch deictic_pi pi.launch.py enable_depth:=${PI_DEPTH:-false}
    restart: unless-stopped     # the camera comes back by itself after a reboot
    stop_signal: SIGINT         # lets ros2 launch shut the driver down cleanly
