# Single source of truth for topic names, types and QoS.
# Add a topic here before any node publishes or subscribes to it.
#
#   qos: reliable     = QoSProfile(depth=10)
#        best_effort  = BEST_EFFORT, KEEP_LAST (sensor data)
#        latched      = RELIABLE, TRANSIENT_LOCAL, depth 1 (state: late joiners get the last value)
#   from: machine / node that publishes it
#
# Names are the go2_ros2_sdk single-robot names (one ROBOT_IP). With several IPs the
# driver prefixes them with robot0/, robot1/, ...

go2:  # go2_ros2_sdk driver, on the workstation or laptop (WebRTC to the robot)
  odom:              {type: nav_msgs/msg/Odometry,          qos: reliable,    from: go2_driver_node}
  imu:               {type: go2_interfaces/msg/IMU,         qos: reliable,    from: go2_driver_node}
  joint_states:      {type: sensor_msgs/msg/JointState,     qos: reliable,    from: go2_driver_node}
  go2_states:        {type: go2_interfaces/msg/Go2State,    qos: reliable,    from: go2_driver_node}
  point_cloud2:      {type: sensor_msgs/msg/PointCloud2,    qos: best_effort, from: go2_driver_node}
  scan:              {type: sensor_msgs/msg/LaserScan,      qos: best_effort, from: pointcloud_to_laserscan}
  camera/image_raw:  {type: sensor_msgs/msg/Image,          qos: best_effort, from: go2_driver_node, note: Go2 front camera}
  camera/camera_info: {type: sensor_msgs/msg/CameraInfo,    qos: best_effort, from: go2_driver_node}

cmd:  # velocity chain: twist_mux picks the highest-priority live input
  cmd_vel_joy:       {type: geometry_msgs/msg/Twist, qos: reliable, from: go2_teleop_node, note: joystick, twist_mux priority 10}
  cmd_vel:           {type: geometry_msgs/msg/Twist, qos: reliable, from: navila_node,     note: infer mode (enable_motion), twist_mux priority 5, 0.5 s timeout}
  cmd_vel_out:       {type: geometry_msgs/msg/Twist, qos: reliable, from: twist_mux,       note: the only velocity input the driver reads}
  joy:               {type: sensor_msgs/msg/Joy,     qos: reliable, from: joy_node}

navila:  # infer mode
  navila/instruction: {type: std_msgs/msg/String, qos: reliable, from: make instruct / wake_router (audio_stt), note: '"stop" ends the episode'}
  navila/decision:    {type: std_msgs/msg/String, qos: reliable, from: navila_node, note: NaVILA's raw text per decision}

camera:  # Orbbec Gemini 335 on the Pi (robot/pi/deictic_pi). Raw frames never leave the Pi: only the JPEG stream crosses Wi-Fi
  orbbec/color/image_raw:            {type: sensor_msgs/msg/Image,           qos: reliable, from: Pi orbbec_camera, note: '640x480 rgb8, 15 Hz. Pi only: never subscribe over Wi-Fi'}
  orbbec/color/image_raw/compressed: {type: sensor_msgs/msg/CompressedImage, qos: reliable, from: Pi orbbec_camera, note: 'JPEG, ~45 KB, 15 Hz. The colour stream other machines use'}
  orbbec/color/camera_info:          {type: sensor_msgs/msg/CameraInfo,      qos: reliable, from: Pi orbbec_camera}
  orbbec/color/image_decoded:        {type: sensor_msgs/msg/Image,           qos: reliable, from: orbbec_decode (bringup), note: 'raw copy on the bringup machine, for NaVILA (NAVILA_CAMERA_TOPIC)'}
  orbbec/depth/image_raw:            {type: sensor_msgs/msg/Image,           qos: reliable, from: Pi orbbec_camera, note: 'only with enable_depth:=true, which needs a 5 A supply (robot/pi/README.md)'}

stt:  # mic speech-to-text on the bringup machine (audio_stt). Wake phrase: "Hey Roxy"
  stt/transcript: {type: std_msgs/msg/String, qos: reliable, from: stt_node, note: every finished sentence the mic hears}
  stt/request:    {type: std_msgs/msg/String, qos: reliable, from: wake_router, note: 'what was said after "Hey Roxy"; empty = the wake phrase alone'}
  stt/mute:       {type: std_msgs/msg/Bool,   qos: latched,  from: dialog_node, note: 'true while Roxy speaks: the mic is ignored, so Roxy never hears itself'}

voice:  # spoken replies (ros_ws/src/voice on the bringup machine, speaker on the Pi), with voice:=true
  voice/say:      {type: std_msgs/msg/String,          qos: reliable, from: dialog_node / make say, note: text for Roxy to speak}
  voice/qa:       {type: std_msgs/msg/String,          qos: reliable, from: dialog_node, note: 'JSON {heard, intent, question, reply} per request, for logs and the recorder'}
  voice/audio:    {type: std_msgs/msg/UInt8MultiArray, qos: reliable, from: tts_node, note: 'one complete WAV file per line, ~50-250 KB'}
  voice/speaking: {type: std_msgs/msg/Bool,            qos: latched,  from: Pi speaker_node, note: true while the Pi speaker plays}
  voice/preset:   {type: std_msgs/msg/String,          qos: latched,  from: tts_node, note: 'scooby | robot; dialog_node talks in the matching style'}

episode:  # data collection (ros_ws/src/recorder, `make collect`)
  episode/event:   {type: std_msgs/msg/String, qos: reliable, from: recorder (collect), note: 'JSON per listen / go / end, also written into each episode bag; the instruction is in go'}
