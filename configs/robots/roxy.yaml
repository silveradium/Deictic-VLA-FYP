# Roxy (Go2 Air) parameters, loaded by deictic_bringup. configs/ is mounted into the
# containers, so edits apply on the next `make infer` without a rebuild.

navila_node:
  ros__parameters:
    # Mid-level controller: NaVILA text -> closed-loop velocity on odometry.
    # Cruise speeds. NaVILA's paper uses 30 deg/s, but Roxy only reaches 24 deg/s at that
    # command; 45 deg/s gives a real 40 deg/s.
    lin_speed: 0.5          # m/s
    ang_speed_deg: 45.0     # deg/s
    # Slow-down floor near the target: must be a speed the robot actually follows, or steps
    # stall short of the target until the timeout (9 deg/s made 45 deg turns take ~7.5 s).
    # `make calibrate` on Roxy (2026-10-12), commanded -> measured turn rate:
    #   6-15 -> 0-1,  20 -> 3,  25 -> 9,  30 -> 24,  45 -> 40 deg/s;  StopMove coast <= 4.5 deg
    min_lin_speed: 0.15     # m/s, not calibrated yet (make calibrate FORWARD=1)
    min_ang_speed_deg: 30.0 # deg/s
    timeout_factor: 3.0     # give up after factor * nominal duration + 2 s
    # Each action starts from the current yaw: turns are exactly what NaVILA said, forward walks straight.
    # true (the sim's Habitat-style heading grid) carried leftover error into the next action: "45 deg"
    # decisions ran as 0..117 deg on Roxy (2026-10-17)
    carry_heading: false
    max_hold_ang_speed_deg: 15.0  # forward steps correct heading at most this fast (never a spin)
    # Hard clamps on anything sent to cmd_vel
    max_lin: 0.5            # m/s
    max_ang: 0.8            # rad/s
    # NaVILA squares every frame (trained on 90 deg HFOV): crop = center square (~55 deg of the Orbbec's 69),
    # squash = full width stretched, pad = full width letterboxed. `make navila-probe` compares them
    image_mode: crop

# Joystick (teleop_twist_joy, started by deictic_bringup), on top of go2's twist_mux.yaml. It drives
# only while the enable button is held. Without that, an idle joystick sends zeros on cmd_vel_joy at
# 20 Hz (joy autorepeat) and twist_mux, priority 10, never lets navila_node's or `make calibrate`'s
# cmd_vel (priority 5) through: the robot never moves while a joystick is plugged in.
go2_teleop_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 5  # RB on an Xbox pad, R1 on a PlayStation one; check with `ros2 topic echo /joy`

# Mic speech-to-text (ros_ws/src/audio_stt), on the machine the DJI Mic Mini is plugged into
stt_node:
  ros__parameters:
    # MIC=dji|builtin in .env picks one; each is a device name substring, an index, "pulse" or "default"
    mic_device_dji: MINI          # DJI Mic Mini receiver (USB)
    mic_device_builtin: CS8409    # the laptop's built-in mic (HDA Intel PCH: CS8409/CS42L42 Analog)
    model_arch: medium-streaming  # Moonshine; small-streaming if the CPU can't keep up
    keyterms: [Roxy, Hey Roxy, heroxy]    # biases recognition towards the robot's name
    unmute_delay: 0.5             # s the mic stays muted after Roxy stops speaking (stt/mute)

# "Hey Roxy" wake phrase -> navila/instruction (audio_stt)
wake_router:
  ros__parameters:
    wake_prefixes: [hey, hi, hay, hello, ok, okay, oi]
    wake_names: [roxy, roxie, roxi, rocksy, roxey]      # wake Roxy on their own
    wake_names_loose: [rocky, foxy, proxy, rox, rocks]  # sound-alikes: only after "hey ..."
    stop_words: [stop, halt, freeze]  # a sentence starting with one ends the episode at once, wake phrase or not
    greet_prefixes: [hi, hello]       # "Hi Roxy" alone is a "hi" request: Roxy waves (with VOICE=true)
    followup_window: 8.0              # s after a bare "Hey Roxy" in which the next sentence is the request
    forward_to_navila: true           # false: only stt/request, another node decides what reaches NaVILA

# Pi speaker (robot/pi/deictic_pi): plays voice/audio
speaker_node:
  ros__parameters:
    alsa_device: plughw:CARD=Device,DEV=0  # USB sound card + 3.5 mm speaker on Roxy's Pi (aplay -L)
    gain_db: 8.0   # boost past the card's max (keep its mixer at 100%), soft-limited; `make pi-volume GAIN=...`

# Spoken replies (ros_ws/src/voice), on the bringup machine, with VOICE=true in .env
dialog_node:
  ros__parameters:
    gemini_model: gemini-3.5-flash-lite  # fast; gemini-3.8-flash for smarter answers
    thinking_level: minimal              # "" for the model's default
    gemini_timeout: 15.0                 # s
    max_words: 100                        # length of spoken answers
    history_turns: 4                     # earlier exchanges Gemini sees

# Voice tricks (ros_ws/src/tricks): voice/trick -> Unitree sport commands; `make trick NAME=sit`
trick_node:
  ros__parameters:
    stand_settle: 3.0                   # s after StandUp / RiseSit before the next command
    forward_instruction: forward 1 m    # come_forward: an exact move for navila_node (infer stacks, MOTION=1)

tts_node:
  ros__parameters:
    # Roxy's voice: a name from ros_ws/src/voice/voice/voice_library.py (scooby, robot, poppy-bright, ...);
    # `make voice-preset PRESET=...` while running. A voice picked in the dashboard's Voice tab
    # (data/voice/roxy_voice.json) wins over this while the dashboard runs.
    voice_preset: robot
    piper_voice: en_US-ryan-medium     # fallback for a voice whose Piper model isn't in the image
    piper_voices_dir: /opt/piper-voices
